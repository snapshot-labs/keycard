name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    uses: snapshot-labs/actions/.github/workflows/test.yml@main
    secrets: inherit
    with:
      target: '22'
      postgres_database_name: keycard_test
      postgres_schema_path: ''
      # Shared action provisions postgres with password "postgres"; local
      # .env.test uses "password" to match docker-compose.
      dotenv_vars: DATABASE_URL=postgres://postgres:postgres@localhost:5432/keycard_test
